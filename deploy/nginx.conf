server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types application/javascript application/json application/manifest+json image/svg+xml text/css;
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }
  location = /patient {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files /patient.html =404;
  }
  location = /patient/ {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files /patient.html =404;
  }
  location = /doc {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files /doc.html =404;
  }
  location = /doc/ {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files /doc.html =404;
  }
  location = /sw.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    return 404;
  }
  location /_expo/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location ~ ^/manifest(?:-doctor)?\.webmanifest$ {
    add_header Cache-Control "public, max-age=300" always;
    try_files $uri =404;
  }
  location ~ ^/(?:lab-icon-v2-512|apple-touch-icon|startup-[^/]+)\.png$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location = /clinical-carotid-overview.svg {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 20m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }
}
